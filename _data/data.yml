experiences:
  title: Experiences
  info:
    - role: Customer Delivery Engineering Technical Leader
      time: Nov 2024 - May 2026
      company: Cisco, Rio de Janeiro
      details: |
        Technical leadership of architects on collaboration implementation projects for enterprise customers. Set architecture standards, design reviews and technical governance throughout delivery.
    - role: Consulting Engineer, Collaboration Solutions
      time: Nov 2018 - Nov 2024
      company: Cisco, Rio de Janeiro
      details: |
        Designed collaboration architectures for multi-site, hybrid cloud/on-prem projects. Detailed technical specification of CUCM, HCS, Webex Calling, Contact Center, CUBE/SBC, ITSP integration. Capacity sizing, high availability and disaster recovery design. Integration with Active Directory/LDAP, gateways and management platforms; technical review of proposals.
    - role: Customer Support Engineer, CUCM
      time: Aug 2017 - Nov 2018
      company: Cisco
      details: |
        Resolution of complex failures in enterprise CUCM architectures — hands-on experience that informs architectural decisions.
    - role: Solution Support Engineer, HCS
      time: Apr 2016 - Aug 2017
      company: Cisco
      details: |
        Operation and troubleshooting of large-scale multi-tenant HCS environments.
    - role: Customer Support Engineer
      time: Nov 2014 - Apr 2016
      company: Cisco
    - role: Founder
      time: Feb 2022 - Present
      company: Hallen Tech, Rio de Janeiro
      details: |
        Architecture and delivery of full-stack web platforms (NestJS, Prisma, PostgreSQL, React 19, TypeScript). Operate a private Kubernetes cluster (Proxmox, kubeadm HA, Flannel, MetalLB, Traefik) as a hands-on reference for modern on-prem architecture.
    - role: Co-Founder
      time: Jan 2021 - Present
      company: EDCA Treinamentos
      details: |
        Senior technical training program in networking, collaboration and development.
    - role: Network Support Analyst
      time: Feb 2008 - Nov 2014
      company: MRS Logística, Juiz de Fora
      details: |
        Second level engineer responsible for network, telephony infrastructure, collaboration servers and endpoints, datacenter network and interconnections. Researched, planned and implemented new technologies, managing and coordinating the field team during implementation.
    - role: Founder
      time: May 2004 - Feb 2008
      company: Sol Informática, Juiz de Fora
      details: |
        Computer maintenance and small projects for data and voice networks, desktop software, websites and small web-based systems for residential and small enterprises.

