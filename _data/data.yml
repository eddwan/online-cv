career-profile:
  title: Profile
  summary: |
    Collaboration solutions architect with 12 years at Cisco and end-to-end delivery experience: discovery, architecture design, sizing, integration and go-live. Deep expertise in CUCM, HCS, Webex Calling, Contact Center and automation (DevNet, Python). Proven record designing solutions for multi-site, hybrid cloud/on-prem projects at Fortune 500 customers across the Americas and EMEA. MBA in Project Management. Trilingual.

